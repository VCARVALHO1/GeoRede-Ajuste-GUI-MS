[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "georede-ajuste"
version = "0.1.0"
description = "Geodetic network adjustment, residual analysis, Plotly outputs, and matrix visualization."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Victor Carvalho" }
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "PyQt5>=5.15.0",
    "PyQtWebEngine>=5.15.0",
    "openpyxl>=3.0.0",
    "reportlab>=3.6.0",
]

[project.scripts]
georede-ajuste = "freesurvey.cli:main"
georede-ajuste-v01 = "freesurvey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

